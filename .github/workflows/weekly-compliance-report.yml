name: Weekly Compliance Report

# Schedule: Every Monday at 9am UTC. Manual trigger available via workflow_dispatch
on:
  schedule:
    # Cron syntax: minute hour day-of-week
    # 0 9 * * 1 = 9:00 AM UTC every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allows manual triggering from GitHub Actions UI

permissions:
  contents: read
  actions: write

jobs:
  compliance-report:
    name: Generate Weekly Compliance Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log analysis

      # Generate report timestamp and week boundaries
      - name: Calculate timestamps
        id: dates
        run: |
          REPORT_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          WEEK_START=$(date -u -d '7 days ago' '+%Y-%m-%d')
          WEEK_END=$(date -u '+%Y-%m-%d')
          REPORT_FILENAME="compliance-report-$(date -u '+%Y%m%d').md"
          echo "report_date=$REPORT_DATE" >> $GITHUB_OUTPUT
          echo "week_start=$WEEK_START" >> $GITHUB_OUTPUT
          echo "week_end=$WEEK_END" >> $GITHUB_OUTPUT
          echo "report_filename=$REPORT_FILENAME" >> $GITHUB_OUTPUT

      # Section 1: Change Management, git log for past 7 days
      - name: Extract change management data
        id: change-mgmt
        run: |
          cat > change-log.txt << 'EOF'
# Change Management Log (Past 7 Days)

EOF
          git log --oneline --since='7 days ago' >> change-log.txt 2>&1 || echo "No commits in past 7 days" >> change-log.txt

      # Section 2: Dependency Audit, NPM
      - name: Check and audit NPM dependencies
        id: npm-check
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            echo "## NPM Dependency Audit" > npm-audit.txt
            npm audit --json 2>&1 | head -100 >> npm-audit.txt || echo "NPM audit completed with warnings" >> npm-audit.txt
          else
            echo "No package.json found" > npm-audit.txt
          fi

      # Section 3: Dependency Audit, Pip
      - name: Setup Python and check Pip dependencies
        id: pip-check
        continue-on-error: true
        run: |
          if [ -f requirements.txt ] || [ -f agent/requirements.txt ]; then
            echo "## Pip Dependency Audit" > pip-audit.txt
            python3 -m pip install pip-audit --quiet 2>/dev/null
            REQS_FILE="requirements.txt"
            if [ ! -f "$REQS_FILE" ] && [ -f agent/requirements.txt ]; then
              REQS_FILE="agent/requirements.txt"
            fi
            pip-audit -r "$REQS_FILE" --desc 2>&1 | head -100 >> pip-audit.txt || echo "Pip audit completed" >> pip-audit.txt
          else
            echo "No requirements.txt found" > pip-audit.txt
          fi

      # Section 4: Codebase Statistics
      - name: Generate codebase statistics
        id: codebase-stats
        run: |
          cat > codebase-stats.txt << 'EOF'
## Codebase Statistics

### File Count by Type
EOF

          # Count major file types
          echo "- JavaScript/TypeScript files: $(find . -type f \( -name '*.js' -o -name '*.ts' -o -name '*.tsx' -o -name '*.jsx' \) 2>/dev/null | wc -l)" >> codebase-stats.txt
          echo "- Python files: $(find . -type f -name '*.py' 2>/dev/null | wc -l)" >> codebase-stats.txt
          echo "- YAML/JSON config files: $(find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) 2>/dev/null | wc -l)" >> codebase-stats.txt
          echo "- Markdown documentation: $(find . -type f -name '*.md' 2>/dev/null | wc -l)" >> codebase-stats.txt

          echo "" >> codebase-stats.txt
          echo "### Repository Size" >> codebase-stats.txt
          echo "Total files: $(find . -type f 2>/dev/null | wc -l)" >> codebase-stats.txt
          echo "Total directories: $(find . -type d 2>/dev/null | wc -l)" >> codebase-stats.txt

      # Section 5: Security Controls Verification
      - name: Verify security controls
        id: security-controls
        run: |
          cat > security-controls.txt << 'EOF'
## Security Controls Verification

EOF

          # Check .gitignore existence
          if [ -f .gitignore ]; then
            echo "✓ .gitignore present" >> security-controls.txt
            echo "  - Sensitive files configured: $(grep -E '\.env|\.pem|\.key|node_modules|venv' .gitignore | wc -l) patterns" >> security-controls.txt
          else
            echo "✗ .gitignore MISSING" >> security-controls.txt
          fi

          # Check lock files for dependency pinning
          if [ -f package-lock.json ] || [ -f yarn.lock ] || [ -f pnpm-lock.yaml ]; then
            echo "✓ NPM/Yarn lock file present" >> security-controls.txt
          fi

          if [ -f Pipfile.lock ] || [ -f poetry.lock ]; then
            echo "✓ Python lock file present" >> security-controls.txt
          fi

          # Check README presence
          if [ -f README.md ]; then
            echo "✓ README.md present" >> security-controls.txt
          else
            echo "⚠ README.md not found" >> security-controls.txt
          fi

      # Section 6: Sensitive File Scanner
      - name: Scan for sensitive files
        id: sensitive-scan
        run: |
          cat > sensitive-files.txt << 'EOF'
## Sensitive File Detection

Scanning for potentially exposed credentials and secrets...

EOF

          # Scan for dangerous file extensions
          FOUND_SENSITIVE=false

          # Check for private keys
          if find . -type f \( -name '*.p8' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' -not -path './node_modules/*' 2>/dev/null | grep -q .; then
            echo "⚠ WARNING: Private key files found:" >> sensitive-files.txt
            find . -type f \( -name '*.p8' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' -not -path './node_modules/*' 2>/dev/null >> sensitive-files.txt
            FOUND_SENSITIVE=true
          fi

          # Check for .env files
          if find . -type f -name '.env*' -not -path './.git/*' -not -path './node_modules/*' 2>/dev/null | grep -q .; then
            echo "⚠ WARNING: Environment files found:" >> sensitive-files.txt
            find . -type f -name '.env*' -not -path './.git/*' -not -path './node_modules/*' 2>/dev/null >> sensitive-files.txt
            FOUND_SENSITIVE=true
          fi

          if [ "$FOUND_SENSITIVE" = false ]; then
            echo "✓ No obvious sensitive files detected" >> sensitive-files.txt
          fi

      # Consolidate all sections into final report
      - name: Assemble compliance report
        id: assemble-report
        run: |
          cat > "${{ steps.dates.outputs.report_filename }}" << 'EOF'
# Weekly Compliance Report

**Generated:** ${{ steps.dates.outputs.report_date }}
**Report Period:** ${{ steps.dates.outputs.week_start }} to ${{ steps.dates.outputs.week_end }}
**Repository:** ${{ github.repository }}
**Commit SHA:** ${{ github.sha }}

---

## Section 1: Change Management

**Purpose:** Track all code changes during the compliance period for audit trail.

EOF

          cat change-log.txt >> "${{ steps.dates.outputs.report_filename }}"

          cat >> "${{ steps.dates.outputs.report_filename }}" << 'EOF'

---

## Section 2: Dependency Audit (NPM)

**Purpose:** Identify security vulnerabilities in JavaScript/Node.js dependencies.

EOF

          cat npm-audit.txt >> "${{ steps.dates.outputs.report_filename }}"

          cat >> "${{ steps.dates.outputs.report_filename }}" << 'EOF'

---

## Section 3: Dependency Audit (Pip)

**Purpose:** Identify security vulnerabilities in Python dependencies.

EOF

          cat pip-audit.txt >> "${{ steps.dates.outputs.report_filename }}"

          cat >> "${{ steps.dates.outputs.report_filename }}" << 'EOF'

---

## Section 4: Codebase Statistics

**Purpose:** Track codebase composition and growth for governance.

EOF

          cat codebase-stats.txt >> "${{ steps.dates.outputs.report_filename }}"

          cat >> "${{ steps.dates.outputs.report_filename }}" << 'EOF'

---

## Section 5: Security Controls Verification

**Purpose:** Ensure baseline security controls are in place (.gitignore, lock files, etc.).

EOF

          cat security-controls.txt >> "${{ steps.dates.outputs.report_filename }}"

          cat >> "${{ steps.dates.outputs.report_filename }}" << 'EOF'

---

## Section 6: Sensitive File Detection

**Purpose:** Scan repository for accidentally committed credentials.

EOF

          cat sensitive-files.txt >> "${{ steps.dates.outputs.report_filename }}"

          cat >> "${{ steps.dates.outputs.report_filename }}" << 'EOF'

---

## Next Steps for SOC 2 Compliance

1. **Review Findings:** Address any warnings from sections 4-6
2. **Remediate Vulnerabilities:** Create issues for high/critical dependency vulnerabilities
3. **Document Changes:** Add evidence links to COMPLIANCE-TRACKER.md
4. **Schedule Review:** Update review completion date in compliance tracking spreadsheet

---

*This report was automatically generated by GitHub Actions.*
*View complete artifacts in the workflow run.*
EOF

      # Upload timestamped report as artifact
      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-compliance-report-${{ steps.dates.outputs.week_end }}
          path: ${{ steps.dates.outputs.report_filename }}
          retention-days: 365

      # Optional: Create a GitHub issue with report summary
      - name: Create compliance issue (optional)
        if: always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            // Optional: Create a GitHub issue summarizing the weekly report
            // This helps surface compliance status in project tracking
            // Comment out if not using GitHub Issues for compliance tracking

            const fs = require('fs');
            const reportPath = '${{ steps.dates.outputs.report_filename }}';

            if (fs.existsSync(reportPath)) {
              const reportContent = fs.readFileSync(reportPath, 'utf8');

              // Create summary (first 500 chars)
              const summary = reportContent.substring(0, 500) + '...';

              // Note: Uncomment below to auto-create issues
              // github.rest.issues.create({
              //   owner: context.repo.owner,
              //   repo: context.repo.repo,
              //   title: `Weekly Compliance Report: ${{ steps.dates.outputs.week_end }}`,
              //   body: summary,
              //   labels: ['compliance', 'soc2', 'automated']
              // });
            }

# Workflow summary:
# This workflow generates a comprehensive weekly compliance report covering:
# - All code changes (git history) for change management audit
# - Dependency vulnerability scans (npm + pip)
# - Codebase metrics for governance tracking
# - Security control verification (.gitignore, lock files, etc.)
# - Sensitive file detection to catch credential leaks
#
# Reports are retained for 365 days to support SOC 2 Type II evidence trails.
# The workflow is designed to be non-blocking (continue-on-error) to ensure
# it always produces a report even if individual checks fail.
