name: CodeQL Analysis

# Trigger on push, pull requests, and weekly schedule for comprehensive coverage
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Weekly scan: Tuesdays at 2am UTC
    # This complements the Monday 9am compliance report for continuous security monitoring
    - cron: '0 2 * * 2'

# Permissions required for code scanning and security event reporting
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    # Multi-language support: JavaScript/TypeScript + Python
    # CodeQL will auto-detect language based on repo structure
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialize CodeQL for the target language
      # Uses security-extended queries for maximum vulnerability detection
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use security-extended queries for stricter analysis
          queries: security-extended
          # Optionally add custom queries if you have a custom query directory
          # queries: ./custom-queries/

      # Auto-build step for JavaScript/TypeScript
      # For Python, CodeQL typically doesn't require an explicit build step
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        if: matrix.language == 'javascript-typescript'
        continue-on-error: true

      # Manual build for Python projects (if needed)
      - name: Build Python dependencies
        if: matrix.language == 'python'
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --quiet || true
          elif [ -f agent/requirements.txt ]; then
            pip install -r agent/requirements.txt --quiet || true
          fi
        continue-on-error: true

      # Perform the actual CodeQL analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          # generate-sarif-report: true  # Uncomment to explicitly generate SARIF

      # Upload results to GitHub Security tab and SARIF reporting
      # This makes findings visible in repository security dashboard
      - name: Upload CodeQL results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: .
          wait-for-processing: true

  # Separate job for reporting and summary
  report:
    name: Security Report Summary
    runs-on: ubuntu-latest
    needs: analyze
    if: always()
    steps:
      - name: Generate security summary
        run: |
          cat > /tmp/codeql-summary.txt << 'EOF'
          # CodeQL Analysis Summary

          ## Analysis Details
          - Trigger: ${{ github.event_name }}
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          - Run ID: ${{ github.run_id }}

          ## Coverage
          - JavaScript/TypeScript: Scanned with security-extended queries
          - Python: Scanned with security-extended queries

          ## Key Insights
          1. **Security-Extended Queries:** Stricter rules for vulnerability detection
          2. **Results Location:** See GitHub Security tab > Code scanning alerts
          3. **SARIF Upload:** Results uploaded for integration with other tools

          ## Next Actions
          - Review any HIGH or CRITICAL findings immediately
          - Create GitHub issues for identified vulnerabilities
          - Document remediation in COMPLIANCE-TRACKER.md
          - Track closure in your security backlog

          ## More Information
          - CodeQL Queries: https://github.com/github/codeql
          - Query Documentation: https://codeql.github.com/docs/codeql-language-guides/
          EOF
          cat /tmp/codeql-summary.txt

# Workflow notes:
#
# CODEQL ANALYSIS DETAILS:
# ========================
# 1. JavaScript/TypeScript: CodeQL auto-detects .ts, .tsx, .js, .jsx files
#    - Checks for: SQL injection, XSS, path traversal, weak cryptography
#    - Runs in pull_request and push contexts
#
# 2. Python: CodeQL analyzes Python source code
#    - Checks for: SQL injection, code injection, unsafe deserialization
#    - Handles .py files throughout repository
#
# 3. Security-Extended Queries:
#    - Enables stricter rules than default rules
#    - Recommended for SOC 2 / security-conscious projects
#    - May produce more findings than default rule set
#
# INTEGRATION WITH SOC 2:
# =======================
# - Results visible in GitHub Security > Code scanning alerts tab
# - SARIF format enables integration with enterprise tools
# - Weekly schedule ensures continuous monitoring
# - Findings tracked as security evidence for compliance
#
# REMEDIATION WORKFLOW:
# ====================
# 1. Critical findings: Fix immediately or document risk acceptance
# 2. High findings: Address within sprint
# 3. Medium/Low: Include in backlog for future sprints
# 4. False positives: Document suppression reason in code comments
#
# PERFORMANCE NOTES:
# ==================
# - fail-fast: false allows both languages to complete even if one fails
# - continue-on-error: true on optional steps prevents workflow abortion
# - Security-extended queries may take longer than default rules
# - Consider disabling on every-push if analysis time becomes problematic
